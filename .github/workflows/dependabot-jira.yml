name: Dependabot-Jira-Integration

on:
  pull_request:
    types:
      - opened
    branches:
      - develop

permissions:
  pull-requests: write
  contents: read

jobs:
  create_jira:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Login to Jira
        uses: atlassian/gajira-login@v2.0.0
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Create Jira Issue
        id: create
        uses: atlassian/gajira-create@v2.0.1
        with:
          project: MOSIP
          issuetype: Bug
          summary: "[${{ github.event.repository.name }}] ${{ github.event.pull_request.title }}"
          description: |
            **PR URL:** ${{ github.event.pull_request.html_url }}
            **PR Branch:** ${{ github.event.pull_request.head.ref }}
          fields: |
            {
              "labels": [ "security"], 
              "priority": {"name": "Major"}  
            }

      - name: Add Jira Issue Link to GitHub PR
        uses: actions/github-script@v6
        env:
          JIRA_TICKET: ${{ steps.create.outputs.issue }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `✅ Jira Ticket Created: [${process.env.JIRA_TICKET}](${{ env.JIRA_BASE_URL }}/browse/${process.env.JIRA_TICKET})`
            })
